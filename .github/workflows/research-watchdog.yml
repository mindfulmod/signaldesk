name: Published data health watchdog
on:
  schedule:
    - cron: "11 10,22 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check actual published data, independently of collection success
        run: node scripts/check-research-health.mjs --live
      - name: Check published market quote coverage even if research is degraded
        if: ${{ !cancelled() }}
        run: node scripts/check-market-health.mjs --live
